plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    // testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0' // JUNIT
    testImplementation 'org.mockito:mockito-core:5.11.0' // MOCKTIO
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0' // MOCKITO
    testImplementation 'org.assertj:assertj-core:3.25.3' // AssertJ
}

test {
    useJUnitPlatform()
}